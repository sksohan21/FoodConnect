<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Login | FoodConnect</title>

    <link rel="stylesheet"
          href="{{ url_for('static', filename='style.css') }}">

</head>

<body>

<nav class="navbar">

    <div class="logo">
        Food<span>Connect</span> 🍃
    </div>

    <a href="/" class="btn btn-primary">
        Home
    </a>

</nav>


<div class="form-container">

    <h1>Welcome Back 👋</h1>

    <p style="text-align:center; color:#707870; margin-bottom:28px;">
        Continue your journey towards reducing food waste.
    </p>


    <form method="POST">

        <div class="form-group">

            <label>Email Address</label>

            <input
                type="email"
                name="email"
                placeholder="Enter your email"
                required>

        </div>


        <div class="form-group">

            <label>Password</label>

            <input
                type="password"
                name="password"
                placeholder="Enter your password"
                required>

        </div>


        <button type="submit"
                class="btn btn-primary">

            Login

        </button>

    </form>


    <p style="text-align:center; margin-top:22px;">

        Don't have an account?

        <a href="/register"
           style="color:#218739; font-weight:bold;">
            Create Account
        </a>

    </p>

</div>

</body>
</html>
